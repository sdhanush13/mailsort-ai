<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="MailSort AI - sort your Gmail into labels automatically">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .chip { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="160" fill="#6366f1" opacity="0.35" filter="url(#glow)"/>
  <circle cx="180" cy="360" r="140" fill="#0ea5e9" opacity="0.25" filter="url(#glow)"/>

  <!-- Envelope icon -->
  <g transform="translate(80 92)">
    <rect width="96" height="72" rx="14" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <path d="M8 12 L48 42 L88 12" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="96" cy="2" r="16" fill="#a78bfa"/>
    <path d="M89 2 L94 7 L103 -3" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="200" y="152" class="t" font-size="76" font-weight="800" fill="#f8fafc">MailSort <tspan fill="url(#accent)">AI</tspan></text>
  <text x="82" y="222" class="t" font-size="28" fill="#cbd5e1">Sort your Gmail into labels automatically. Rules first, local AI for the rest.</text>
  <text x="82" y="260" class="t" font-size="20" fill="#94a3b8">Runs on your machine · Free · Nothing is deleted without your say</text>

  <!-- Label chips -->
  <g transform="translate(82 300)">
    <rect x="0" y="0" width="200" height="40" rx="20" fill="#0c4a6e"/>
    <text x="100" y="26" text-anchor="middle" class="chip" fill="#7dd3fc">Banks/ICICI/Savings</text>
    <rect x="214" y="0" width="132" height="40" rx="20" fill="#14532d"/>
    <text x="280" y="26" text-anchor="middle" class="chip" fill="#86efac">Banks/Offers</text>
    <rect x="360" y="0" width="228" height="40" rx="20" fill="#3b0764"/>
    <text x="474" y="26" text-anchor="middle" class="chip" fill="#d8b4fe">Investments/Statements</text>
    <rect x="602" y="0" width="184" height="40" rx="20" fill="#713f12"/>
    <text x="694" y="26" text-anchor="middle" class="chip" fill="#fde68a">Jobs/Applications</text>
    <rect x="800" y="0" width="120" height="40" rx="20" fill="#7f1d1d"/>
    <text x="860" y="26" text-anchor="middle" class="chip" fill="#fca5a5">To Delete</text>
  </g>
</svg>
